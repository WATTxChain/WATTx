name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev \
            libdb-dev libdb++-dev \
            libevent-dev libzmq3-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools

      - name: Build
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/wattx-${VERSION}-linux64
          cp build/bin/wattxd build/bin/wattx-cli build/bin/wattx-qt \
             build/bin/wattx-wallet build/bin/wattx-tx \
             dist/wattx-${VERSION}-linux64/ 2>/dev/null || true
          cd dist
          tar czf wattx-${VERSION}-linux64.tar.gz wattx-${VERSION}-linux64/
          sha256sum wattx-${VERSION}-linux64.tar.gz > wattx-${VERSION}-linux64.tar.gz.sha256
          echo "ASSET=dist/wattx-${VERSION}-linux64.tar.gz" >> $GITHUB_ENV
          echo "ASSET_SUM=dist/wattx-${VERSION}-linux64.tar.gz.sha256" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux64
          path: dist/*.tar.gz*

  build-windows:
    name: Build Windows x86_64 (cross-compile)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            g++-mingw-w64-x86-64 mingw-w64-tools nsis

      - name: Build depends (Windows)
        run: |
          cd depends
          make HOST=x86_64-w64-mingw32 -j$(nproc) || echo "::warning::depends build failed, skipping Windows"

      - name: Cross-compile
        run: |
          CONFIG_SITE=$PWD/depends/x86_64-w64-mingw32/share/config.site \
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-mingw64.cmake \
                -DBUILD_GUI=OFF 2>/dev/null || echo "::warning::Windows cross-compile skipped"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win64
          path: dist/*.zip*
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate changelog
        run: |
          VERSION=${GITHUB_REF_NAME}
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..${VERSION} --pretty=format:"- %s" > CHANGELOG_FRAGMENT.md
          else
            echo "- Initial release" > CHANGELOG_FRAGMENT.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "WATTx Core ${{ github.ref_name }}"
          body_path: CHANGELOG_FRAGMENT.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
