name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 shellcheck clang-format

      - name: Shell script lint
        run: |
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/depends/*" |             xargs shellcheck --severity=warning || true

      - name: C++ format check
        run: |
          find src -name "*.cpp" -o -name "*.h" |             xargs clang-format --dry-run --Werror 2>/dev/null ||             echo "::warning::Some files differ from clang-format style"

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev \
            libdb-dev libdb++-dev \
            libevent-dev \
            libzmq3-dev \
            python3

      - name: Configure
        run: cmake -B build -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc) --target wattxd wattx-cli wattx-wallet

      - name: Verify binaries
        run: |
          ls -lh build/bin/
          build/bin/wattxd --version || true
          build/bin/wattx-cli --version || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wattx-linux64-${{ github.sha }}
          path: build/bin/
          retention-days: 7

  build-linux-gui:
    name: Build (Linux x86_64 + Qt GUI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev \
            libdb-dev libdb++-dev \
            libevent-dev libzmq3-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            python3

      - name: Configure with GUI
        run: cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Verify GUI binary
        run: |
          ls -lh build/bin/
          build/bin/wattx-qt --version 2>/dev/null || true

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev \
            libdb-dev libdb++-dev \
            libevent-dev libzmq3-dev python3

      - name: Configure with tests
        run: cmake -B build -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON

      - name: Build test binaries
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: |
          if [ -f build/bin/test_wattx ]; then
            build/bin/test_wattx
          else
            echo "::notice::Test binary not found, skipping"
          fi

  test-regtest:
    name: Regtest Smoke Test
    runs-on: ubuntu-22.04
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev \
            libdb-dev libdb++-dev \
            libevent-dev libzmq3-dev python3

      - name: Build
        run: |
          cmake -B build -DBUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j$(nproc) --target wattxd wattx-cli

      - name: Regtest smoke test
        run: |
          DATADIR=$(mktemp -d)
          DAEMON=build/bin/wattxd
          CLI=build/bin/wattx-cli

          # Start daemon
          $DAEMON -regtest -datadir=$DATADIR -daemon -fallbackfee=0.0002

          # Wait for startup
          sleep 5

          # Create wallet and mine
          $CLI -regtest -datadir=$DATADIR createwallet "ci-test"
          ADDR=$($CLI -regtest -datadir=$DATADIR -rpcwallet=ci-test getnewaddress)
          echo "Mining to: $ADDR"

          $CLI -regtest -datadir=$DATADIR generatetoaddress 201 "$ADDR"

          # Verify state
          HEIGHT=$($CLI -regtest -datadir=$DATADIR getblockcount)
          echo "Block height: $HEIGHT"
          [ "$HEIGHT" -ge 201 ] || (echo "Expected >= 201 blocks, got $HEIGHT" && exit 1)

          # Check staking
          $CLI -regtest -datadir=$DATADIR getstakinginfo

          # Check mining
          $CLI -regtest -datadir=$DATADIR getmininginfo

          # Stop daemon
          $CLI -regtest -datadir=$DATADIR stop
          sleep 3

          echo "Smoke test passed"

  contracts:
    name: Solidity Contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check for Hardhat projects
        id: check
        run: |
          if [ -f contracts/mining-game/hardhat.config.js ] || [ -f contracts/mining-game/hardhat.config.ts ]; then
            echo "has_contracts=true" >> $GITHUB_OUTPUT
          else
            echo "has_contracts=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.has_contracts == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/mining-game/package-lock.json

      - name: Install and compile contracts
        if: steps.check.outputs.has_contracts == 'true'
        working-directory: contracts/mining-game
        run: |
          npm ci
          npx hardhat compile
